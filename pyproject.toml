[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-motion-code-bench"
version = "0.1.0"
description = "Executable video-to-scene benchmark infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "lostgreen" }]
dependencies = [
  "gdown>=6,<7",
  "Pillow>=10.4,<13",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]
sceneact = [
  "huggingface-hub>=0.20,<1",
  "mcp[cli]>=1.3,<2",
  "numpy>=1.26,<2",
  "pygltflib>=1.16,<2",
  "scipy>=1.11,<1.17",
  "trimesh>=4,<5",
]
sceneact-agent = [
  "anthropic>=0.40,<1",
  "openai>=1.50,<3",
  "python-dotenv>=1,<2",
]

[project.scripts]
smcb = "smcb.cli:main"
video2scene = "smcb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["smcb"]
