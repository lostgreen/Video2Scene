dataset:
  name: video2scene_scene_smoke_v0
  num_samples: 1
  output_subdir: generated/scene_smoke
assets:
  pack: quaternius_platformer
  normalized_subdir: normalized
  candidate_library_size: 20
scene:
  object_count:
    min: 1
    max: 1
templates:
  static_orbit: 0.0
  moving_object: 1.0
  moving_camera: 0.0
  parent_motion: 0.0
video:
  width: 128
  height: 128
  fps: 8
  duration_seconds:
    min: 2
    max: 2
render:
  engine: BLENDER_EEVEE_NEXT
  samples: 8
quality_control:
  min_visible_frame_ratio: 0.50
  min_visible_pixels: 20
  max_pairwise_screen_iou: 0.80
  min_motion_distance: 0.10
  max_resample_attempts: 8
seed: 42
